<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header>
        <!--links naar de inventaris en webshop-->
        <nav class="navigatie">
            <ul>
                <li class="logo"><img src="../afbeeldingen/logo/logo.jpg" alt="waloulou logo">
                </li>
                <li><a href="admin.html">inventaris</a></li>
                <li><a href="../index.html">shop</a></li>
            </ul>
        </nav>

        <h1>Edit product</h1>
    </header>

    <main class="container">

        <!--form om een product aan te passen-->

        <form action="#">

            <p>
                <label for="naam">Productnaam</label><br>
                <input type="text" id="naam" name="naam" placeholder="bv. Animal Crossing">
            </p>

            <p>
                <label for="prijs">Prijs (€)</label><br>
                <input type="number" id="prijs" name="prijs" placeholder="50">
            </p>

            <p>
                <label for="platform">Platform</label><br>
                <select id="platform" name="platform">
                    <option value="switch">Switch</option>
                    <option value="playstation">Playstation</option>
                </select>
            </p>

            <p>
                <label for="status">Status</label><br>
                <select id="status" name="status">
                    <option value="instock">In stock</option>
                    <option value="out">Out of stock</option>
                </select>
            </p>

            <p>
                <label for="beschrijving">Beschrijving</label><br>
                <textarea id="beschrijving" name="beschrijving" rows="5" placeholder="Beschrijving..."></textarea>
            </p>

            <p>
                <button type="submit">Opslaan</button>
                <a href="admin.html">Terug</a>
            </p>

        </form>

    </main>


    <footer id="contact">
        <p>Contact: Waloulou@gameshop.be</p>
        <p>&copy; 2026 Walid&co</p>
    </footer>

</body>

</html>
