<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Sigmar+One&family=Special+Gothic+Condensed+One&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="admin.css">

</head>

<body>

    <main class="container">

        <form class="login" action="admin.html">

            <h2 class="titel">Log in</h2>

            <p>
                <label for="username">Username:</label><br>
                <input type="email" name="username" id="username" required placeholder="waloulou@gameshop.be">
            </p>

            <p>
                <label for="password">Password:</label><br>
                <input type="password" name="password" id="password" required>
            </p>

            <p>
                <input type="submit" value="Log in">
            </p>

        </form>

    </main>
    <footer id="contact">
        <p>Contact: Waloulou@gameshop.be</p>
        <p>&copy; 2026 Walid&co</p>
    </footer>

</body>

</html>
